name: CI

# PR과 main push마다 lint · typecheck · build를 실행해 회귀를 막는다.
# 테스트 러너(vitest 등)는 별도 이슈에서 도입.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # 빌드 단계는 실제 DB/Supabase에 접속하지 않지만,
          # process.env.* 가 undefined면 코드 경로가 깨질 수 있어 더미 값 주입.
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-anon-key"
          DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
        run: npm run build
